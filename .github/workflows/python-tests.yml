# 本文件保持 LF 行尾（与仓库在位 workflow 一致，#568 复核结论）
name: python tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "main.py"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "main.py"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"

# #568/#563：Python 研究侧独立 CI 门——只跑 pytest，不接入 bid 的 4 项检查；
# concurrency 组与全仓纪律一致（检查类 run 可被同 ref 新推送安全取消）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 pytest
        run: python -m pytest tests/ -v

      - name: CLI 冒烟（离线全链——help/templates/collect/db import→stats→query）
        # 与 PR 描述的本地冒烟口径一致：四个子命令组真跑一遍。
        # db/collect 链路用 $RUNNER_TEMP 隔离（不碰仓库工作区、零残留）。
        run: |
          set -e
          python main.py --help > /dev/null
          python main.py templates | grep -q "bid_extraction"
          # collect 链路（#601 批次 A）：源装载→去重→入库→查询
          mkdir -p "$RUNNER_TEMP/announcements"
          printf '[{"招标编号":"COL-001","项目名称":"ci-collect","预算金额":"1.2亿","发布日期":"2026年11月1日"},{"bid_id":"COL-001","project_name":"ci-collect-dup"}]' \
            > "$RUNNER_TEMP/announcements/a.json"
          printf '{"bid_id":"COL-002","项目名称":"ci-collect-二期"}\n' \
            > "$RUNNER_TEMP/announcements/b.jsonl"
          python main.py collect --source "$RUNNER_TEMP/announcements" --db "$RUNNER_TEMP/collect.db" | grep -q "已入库 2 条"
          python main.py db --query "ci-collect" --db "$RUNNER_TEMP/collect.db" | grep -q "COL-001"
          python main.py collect --source "$RUNNER_TEMP/announcements" --db "$RUNNER_TEMP/collect.db" --dry-run | grep -q "演练模式"
          # extract 链路（#601 批次 B）：--no-llm 离线直通（CI 无 API key 面）
          python main.py extract --source "$RUNNER_TEMP/announcements" --db "$RUNNER_TEMP/extract.db" --no-llm | grep -q "入库：成功 2 条"
          # --retry 无 API key → 必须明确拒绝（不静默假装重试）
          if python main.py extract --retry --db "$RUNNER_TEMP/extract.db" 2>&1 | grep -q "需要真实 LLM"; then
            echo "retry 无 key 正确拒绝 ✓"
          else
            echo "::error::extract --retry 无 key 未正确拒绝"; exit 1
          fi
          # analyze 链路（#601 批次 C）：离线纯数据报告
          python main.py analyze --db "$RUNNER_TEMP/extract.db" --output-dir "$RUNNER_TEMP/reports" | grep -q "2 条记录"
          ls "$RUNNER_TEMP/reports"/analysis_all_*.md > /dev/null
          # pipeline 链路（#601 批次 D）：全链编排（离线模式）+ 增量重跑
          python main.py pipeline --source "$RUNNER_TEMP/announcements" --db "$RUNNER_TEMP/pipe.db" --output-dir "$RUNNER_TEMP/pipe-reports" --no-llm | grep -q "run #1"
          python main.py pipeline --source "$RUNNER_TEMP/announcements" --db "$RUNNER_TEMP/pipe.db" --output-dir "$RUNNER_TEMP/pipe-reports" --no-llm --incremental | grep -q "读取 0 文件"
          ls "$RUNNER_TEMP/pipe-reports"/analysis_all_*.md > /dev/null
          # db 链路
          printf '[{"bid_id":"SMOKE-001","project_name":"ci-smoke","source_url":"https://example.com/1","budget_wan":1.5,"deadline":"2026-12-31","requirements":["资质A"]}]' \
            > "$RUNNER_TEMP/smoke-import.json"
          python main.py db --import "$RUNNER_TEMP/smoke-import.json" --db "$RUNNER_TEMP/smoke.db" | grep -q "已导入 1 条"
          python main.py db --stats --db "$RUNNER_TEMP/smoke.db" | grep -q "共 1 条项目"
          python main.py db --query "ci-smoke" --db "$RUNNER_TEMP/smoke.db" | grep -q "SMOKE-001"
          echo "CLI 冒烟：help / templates / collect / db import→stats→query 全过"
