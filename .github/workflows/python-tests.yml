# 本文件保持 LF 行尾（与仓库在位 workflow 一致，#568 复核结论）
name: python tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "main.py"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "main.py"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"

# #568/#563：Python 研究侧独立 CI 门——只跑 pytest，不接入 bid 的 4 项检查；
# concurrency 组与全仓纪律一致（检查类 run 可被同 ref 新推送安全取消）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 pytest
        run: python -m pytest tests/ -v

      - name: CLI 冒烟（离线全链——help/templates/collect/extract/analyze/pipeline/eval/db）
        # 与 PR 描述的本地冒烟口径一致：八个子命令组真跑一遍。
        # db/collect/extract/analyze/pipeline 链路用 $RUNNER_TEMP 隔离（不碰仓库工作区、零残留）。
        run: |
          set -e
          python main.py --help > /dev/null
          python main.py templates | grep -q "bid_extraction"
          # collect 链路（#601 批次 A）：源装载→去重→入库→查询
          mkdir -p "$RUNNER_TEMP/announcements"
          printf '[{"招标编号":"COL-001","项目名称":"ci-collect","预算金额":"1.2亿","发布日期":"2026年11月1日"},{"bid_id":"COL-001","project_name":"ci-collect-dup"}]' \
            > "$RUNNER_TEMP/announcements/a.json"
          printf '{"bid_id":"COL-002","项目名称":"ci-collect-二期"}\n' \
            > "$RUNNER_TEMP/announcements/b.jsonl"
          python main.py collect --source "$RUNNER_TEMP/announcements" --db "$RUNNER_TEMP/collect.db" | grep -q "已入库 2 条"
          python main.py db --query "ci-collect" --db "$RUNNER_TEMP/collect.db" | grep -q "COL-001"
          python main.py collect --source "$RUNNER_TEMP/announcements" --db "$RUNNER_TEMP/collect.db" --dry-run | grep -q "演练模式"
          # extract 链路（#601 批次 B）：原文装载→规则抽取→入库→重试幂等
          mkdir -p "$RUNNER_TEMP/raw"
          printf '某某市政务云平台采购项目招标公告\n招标编号：EXT-2026-001\n预算金额：800万元\n投标截止时间：2026年12月20日10时\n资格要求：具备 ISO9001 认证；近三年类似业绩不少于 2 项。\n2026年11月8日\n' \
            > "$RUNNER_TEMP/raw/n1.txt"
          printf '普通文本，没有任何招标结构。\n' \
            > "$RUNNER_TEMP/raw/bad.txt"
          python main.py extract --source "$RUNNER_TEMP/raw" --db "$RUNNER_TEMP/extract.db" | grep -q "成功 1 条，失败 1 条"
          python main.py db --query "EXT-2026-001" --db "$RUNNER_TEMP/extract.db" | grep -q "EXT-2026-001"
          python main.py extract --db "$RUNNER_TEMP/extract.db" | grep -q "处理 1 条"  # 只重试 pending 坏件
          # analyze 链路（#601 批次 C）：采集→五维统计→离线报告
          python main.py analyze --db "$RUNNER_TEMP/collect.db" --output-dir "$RUNNER_TEMP/reports" | grep -q "数据集：2 条项目"
          grep -q "## 五、竞争密度" "$RUNNER_TEMP/reports/"analysis_*.md
          python main.py analyze --db "$RUNNER_TEMP/collect.db" --keyword 不存在 --output-dir "$RUNNER_TEMP/reports" && exit 1 || echo "空集退出码正确"
          # pipeline 链（#601 批次 D）：双源→四阶段→报告（含统计数字）+ 增量重跑
          python main.py pipeline --announcements "$RUNNER_TEMP/announcements" --raw-texts "$RUNNER_TEMP/raw" --db "$RUNNER_TEMP/pipeline.db" --output-dir "$RUNNER_TEMP/preports" | grep -q "全部成功"
          grep -q "## 五、竞争密度" "$RUNNER_TEMP/preports/"pipeline_*.md
          python main.py pipeline --announcements "$RUNNER_TEMP/announcements" --raw-texts "$RUNNER_TEMP/raw" --db "$RUNNER_TEMP/pipeline.db" --output-dir "$RUNNER_TEMP/preports" | grep -q "collect：读取 2 文件，新增 0"
          # eval 链（#601 批次 E）：gold 标注字段命中率（规则基线）
          python main.py eval | grep -q "字段命中率 100.0%（14/14）"
          python main.py eval --mode api 2>/dev/null && exit 1 || true  # 无密钥退出 2（门验证）
          # db 链路
          printf '[{"bid_id":"SMOKE-001","project_name":"ci-smoke","source_url":"https://example.com/1","budget_wan":1.5,"deadline":"2026-12-31","requirements":["资质A"]}]' \
            > "$RUNNER_TEMP/smoke-import.json"
          python main.py db --import "$RUNNER_TEMP/smoke-import.json" --db "$RUNNER_TEMP/smoke.db" | grep -q "已导入 1 条"
          python main.py db --stats --db "$RUNNER_TEMP/smoke.db" | grep -q "共 1 条项目"
          python main.py db --query "ci-smoke" --db "$RUNNER_TEMP/smoke.db" | grep -q "SMOKE-001"
          echo "CLI 冒烟：help / templates / collect / extract / analyze / pipeline / eval / db 全过"
