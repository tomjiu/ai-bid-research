[workspace]
resolver = "2"
members = [
    "crates/bid-domain",
    "crates/bid-parse",
    "crates/bid-kb",
    "crates/bid-tools",
    "crates/bid-grade",
    "crates/bid-mcp",
    "crates/bid-engine",
    "crates/mang-snap",
    # FG-01（#303）：mang-app 撤掉空 [workspace] 表并入本 workspace——
    # 此前它是独立 workspace，cargo test --workspace 不含它，39 个测试
    # 从未在 CI 执行（diag.rs tools==13 腐烂断言因此潜伏）。见 audit
    # false-green-register.md FG-01 与 issue #303。
    # 注意：本成员含 tao/wry GUI 依赖，Linux 本地构建需 gtk/webkit2gtk dev。
    "crates/mang-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
unicode-normalization = "0.1"
libc = "0.2"
# #68 阶段 1：真实 LLM 通路（OpenAI 兼容 chat/completions）——阻塞式
# HTTP 客户端 + rustls（workspace 无异步栈，ureq 2 是最小三方面）。
ureq = { version = "2", default-features = true }
# #68 阶段 3：导出图片嵌入的格式验证/转 PNG/尺寸面（已在依赖图中——
# docx-rs 0.4 default feature "image" 直依赖，此处提为直接依赖零新增）。
image = "0.25"

# B4（issue #11 任务 3）：zip / quick-xml / calamine / memchr 工作区条目已删——
# docx/xlsx 解析收敛引擎（bid-engine → mdc-office-io），workspace 成员不再
# 直接依赖 OOXML 解析栈（引擎侧依赖不入本清单）。

# #248 发行 profile（workspace 根 = 唯一生效位——mang-app 已并入本
# workspace，#303/FG-01 后不再有独立 workspace；日常开发走 [profile.dev]
# 不受影响，仅 --release 构建（发行工作流）消费本段）。
#
# 保守档（不引入高风险面）：
#   strip = "symbols"     不分发调试符号（Windows 面配合 debug=false：无 PDB
#                          路径残留；strip 再兜底剥符号表）；
#   lto = "thin"          跨 crate 优化的低风险档（fat LTO 编译时数倍且对
#                          tao/wry/webview2 绑定链未经实测——不冒进）；
#   codegen-units = 1     发行构建慢一点换更优代码（只影响 release 构建）。
# 明确不做：panic = "abort"（改变 unwind 语义——引擎面 guard/恢复逻辑
# 依赖 panic unwinding，未经 Windows 实测不开）；商业加壳/反调试（issue
# #248 明确排除，如需再独立评估）。
[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
