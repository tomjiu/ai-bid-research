[package]
name = "bid-engine"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "issue #2 · B3：引擎适配层唯一接触面——mdc-office-io 固定 rev 接入 + EngineReader 实装 + 字段级映射；rev 现钉 f4328ebf（MDCORE_REV 常量经 build.rs 从本文件注入，#327）"

# B3 边界（issue #2 §B3 + issue #11 主线）：
# - 本 crate 是标书仓**唯一**引擎接触面（issue #2 §1 约束 1）；
# - 只做「调用与字段搬运」——解析/安全门/指纹语义一律引擎侧（约束 2），
#   引擎缺口走账本登记，禁止映射层自研补齐（约束 3）；
# - mdcore 以**完整 40 位 rev** 钉住（issue #2 §3.1——禁止 branch/tag 浮动）；
#   升级 rev 走独立 PR（chore(dep): bump mdcore to <hash>）并重跑基线差分。

[dependencies]
bid-parse = { path = "../bid-parse" }

# ── mdcore 引擎接入（B3 主线 · issue #11 验收：cargo tree -p bid-engine 必须见 mdc-office-io）──
# rev = mdcore main @ f4328ebf4f936e1321a2254382d59f9ab9f94b7b（bump 链：
#   3204342d →（#110 任务 2，87 提交）→ aa0c859d →（后续 bump，93 提交）→ 本 rev
#   ——3204342d..f4328ebf 共 180 提交，审计实测口径，旧注释「87 提交」仅覆盖首段）。bid-engine 消费面（docx.rs / io.rs / pdf
#   protocol+worker）**公开 API 零破坏**（签名逐一 diff 验证：docx 读写函数族、io 读门、
#   Command::ExtractText 面全部不变）；新增能力面（本 PR 接线消费）：
#   · office-io style.rs（#103 S1-t1：StyleTree + basedOn 链 + 主题色——样式模板读取）
#   · mdcore pagination.rs（issue #29 N-5：分页预估 v2——40 万字档 LO 实测误差
#     缺省 +2.7% / 中文标书档 -1.1%，模型自报误差带）
#   其余新面（docx_edit / numbering / mdc-formula / pdf organize·annotate·links·
#   layers·ocr）见 lib.rs 能力账本——可用未接，各有登记理由。
# 语义变化注意（引擎侧修复，读面输出可能微变）：pdf outline 首个顶层书签不再丢失
#   （#68 批 4 正路径修复——bid 侧 ExtractText 不消费 outline，无影响）；门 3 对
#   pretty-printed XML 的误拒修复（E3）——此前被拒的合法件现在能读（差分归
#   EXPECTED_DIFF，方向 = 覆盖面扩大）。
# 私有仓凭据：本机 ~/.gitconfig insteadOf 注入（PAT 不入仓、不入 CI 日志——issue #2 §3.1）。
mdc-office-io = { git = "https://git.mingjiu.store/sandbox/mdcore", rev = "f4328ebf4f936e1321a2254382d59f9ab9f94b7b", package = "mdc-office-io" }
# #110 任务 2：mdcore 核心包（pagination 分页预估 + word_count 口径面）——与 office-io
# 同 rev 钉住（单源纪律：两包不同 rev = 跨包语义漂移面）。
mdcore = { git = "https://git.mingjiu.store/sandbox/mdcore", rev = "f4328ebf4f936e1321a2254382d59f9ab9f94b7b", package = "mdcore" }
# B3-5：pdf 文本通道（engine-pdfium 特性——pdfium 动态库 env MDC_PDFIUM_LIB 或编译期候选；
# 无 pdfium 环境走 SKIP 语义，测试不伪装失败——issue #9 口径）
mdc-pdf = { git = "https://git.mingjiu.store/sandbox/mdcore", rev = "f4328ebf4f936e1321a2254382d59f9ab9f94b7b", package = "mdc-pdf", features = ["engine-pdfium"] }
sha2 = "0.10"
hex = "0.4"
# calamine 0.36 与引擎 mdc-office-io 同版（Data/Range/Dimensions 类型面——读侧零语义，仅字段搬运）
calamine = "0.36"
# scripts/b5_engine_gt_eval.py 动态生成的 example（GT 抽取对比）需要 bid_domain::Requirement
bid-domain = { path = "../bid-domain" }
# #545（B-11 残留面）：章号区 nfkc 归一——「第２章」全角数字与 PDF 侧
# （extract.rs:703 先 nfkc 再匹配）跨格式对称；workspace 单一版本源。
unicode-normalization = { workspace = true }

[dev-dependencies]
serde_json = "1"
# #110 任务 2 styles 接线测试：测试内构建受控 docx 样式模板（Stored 压缩——
# 零特性面）。版本已在依赖图（bid-tools dev-dep 4.6.1 锁内）——不新增三方。
zip = "4"
