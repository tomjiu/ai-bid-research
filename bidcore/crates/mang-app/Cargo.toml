# FG-01（#303）：本文件曾有过的空 [workspace] 表把 mang-app 隔离成独立
# workspace——bidcore 的 cargo test --workspace 不含它，CI 只对它 cargo check
# （编译不执行），39 个测试（fs 围栏 write_bytes_guard / 路径穿越 / llm 掩码
# 安全面）从未运行，diag.rs 的 tools==13 腐烂断言因此从未被发现。
# 现并入 bidcore workspace：测试随 --workspace 全量执行（Windows CI 实证）。
# 本地 Linux 注意（#405 后口径）：系统需 gtk/webkit2gtk dev 包（tao/wry 的
# Linux 后端）——pkg-config 找不到 gtk+-3.0 / webkit2gtk-4.1 即缺件；
# rfd 的 Linux 后端已在下方 cfg(linux) 段补齐。跑其他成员用
# cargo test -p <成员> 即可。

[package]
name = "mang-app"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "标书桌面壳（过渡方案）：tao + wry WebView + 直链 bidcore"

[dependencies]
tao = "0.37"
wry = "0.57"
# 直链 bidcore（方案 A：不经 MCP 层）
bid-domain = { path = "../bid-domain" }
bid-tools = { path = "../bid-tools" }
# #76 设置面板的 MCP 状态面：tools_schema / dispatch 自检（与 bid-mcp 同源
# 编译的引擎应答探测）。依赖均在既有树内（bid-tools 已含其全部三方依赖）。
bid-mcp = { path = "../bid-mcp" }
mang-snap = { path = "../mang-snap" }
serde_json = "1"
# #76 diag.rs：llm.json 的 serde 读/写面（derive）。已在既有依赖图中
# （serde_json/bid-tools 均带），此处只是提为直接依赖，零新增三方取数。
serde = { version = "1", features = ["derive"] }
# 系统文件对话框（同步 API，主线程调用）。关闭默认的 xdg-portal/wayland，
# Windows 只用 Win32 COM（IFileOpenDialog）。
# #405：default-features=false 在 Linux 上没有任何后端——rfd 的 build.rs
# 直接 panic，mang-app 整体不可构建。Linux 后端在下方 cfg(linux) 段补齐。
rfd = { version = "0.17", default-features = false }

# DnD（WM_DROPFILES 子类化）与 explorer /select。windows crate 版本与 tao 0.37/wry 0.57
# 保持同一条锁（0.62.x），不新增版本号。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

# #405：rfd 的 Linux 后端——default-features=false 使上面那条在 Linux 上
# 无任何后端可用（build.rs panic，见 #405 时间线），本段补 gtk3：与
# tao/wry 的 gtk 依赖树同源，不新增版本号。cfg 门控使 Windows/macOS
# 构建零影响（Windows 走上面的 Win32 COM）。
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[build-dependencies]